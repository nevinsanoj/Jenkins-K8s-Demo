apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-book-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-book-store
  template:
    metadata:
      labels:
        app: online-book-store
    spec:
      containers:
        - name: online-book-store
          image: nginx:latest
          ports:
            - containerPort: 80